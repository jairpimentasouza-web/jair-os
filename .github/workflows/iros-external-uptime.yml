name: IROS External Uptime Watch
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/iros-external-uptime.yml']
permissions:
  contents: read
jobs:
  public-entrypoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public HTTPS readiness without credentials
        env:
          IROS_URL: https://iros-activesoft-credentials-form-staging.up.railway.app/health
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl --silent --show-error --max-time 15 --connect-timeout 6 --max-redirs 0 --output "$RUNNER_TEMP/iros-health.json" --write-out '%{http_code}' "$IROS_URL")
          if [[ "$STATUS" != "200" ]]; then
            echo "::error::IROS public entrypoint: unexpected HTTP status $STATUS"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/iros-health.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              data=json.load(f)
          if data.get('ok') is not True or data.get('service') != 'iros-jros-mfa-access':
              raise SystemExit('IROS public entrypoint health payload not ready')
          print('IROS public HTTPS entrypoint ready')
          PY

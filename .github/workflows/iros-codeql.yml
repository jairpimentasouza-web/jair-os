name: IROS Security Static Analysis
on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '.github/workflows/iros-codeql.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  codeql-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize GitHub CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@v3

name: IROS Security Static Analysis
on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.html'
      - '.github/workflows/iros-codeql.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Ações fixadas por SHA (supply chain); o Dependabot mantém as versões atualizadas.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # CodeQL Action v3 é descontinuada em dezembro de 2026.
      - name: Initialize GitHub CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

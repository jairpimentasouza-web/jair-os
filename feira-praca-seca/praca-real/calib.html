<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}#bg{position:absolute;left:0;top:0}canvas{position:absolute;left:0;top:0}</style></head><body>
<img id="bg"><script src="node_modules/three/build/three.min.js"></script><script>
const q = new URLSearchParams(location.search);
const W=+q.get('w'),H=+q.get('h'),fov=+q.get('fov'),h=+q.get('ch'),pitch=+q.get('pitch'),roll=+q.get('roll')||0,yaw=+q.get('yaw')||0;
document.getElementById('bg').src=q.get('img');
const r=new THREE.WebGLRenderer({alpha:true,antialias:true});r.setSize(W,H);document.body.appendChild(r.domElement);
const s=new THREE.Scene();const c=new THREE.PerspectiveCamera(fov,W/H,0.1,1000);
c.position.set(0,h,0);c.rotation.order='YXZ';c.rotation.set(-pitch*Math.PI/180,yaw*Math.PI/180,roll*Math.PI/180);
const pts=[];
for(let x=-60;x<=60;x+=5){pts.push(new THREE.Vector3(x,0,-1),new THREE.Vector3(x,0,-150));}
for(let z=-5;z>=-150;z-=5){pts.push(new THREE.Vector3(-60,0,z),new THREE.Vector3(60,0,z));}
const g=new THREE.BufferGeometry().setFromPoints(pts);
s.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xff0000})));
for(const [x,z] of JSON.parse(q.get('poles')||'[]')){const m=new THREE.Mesh(new THREE.BoxGeometry(0.4,1.7,0.4),new THREE.MeshBasicMaterial({color:0x00ff00}));m.position.set(x,0.85,z);s.add(m);}
r.render(s,c);
</script></body></html>

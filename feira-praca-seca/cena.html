<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;width:1280px;height:720px;font-family:Inter,"DejaVu Sans",sans-serif}
  canvas{display:block}
  .ov{position:absolute;left:0;right:0;text-align:center;color:#fff;opacity:0;text-shadow:0 3px 14px rgba(0,0,0,.75)}
  #title{top:56px}
  #title h1{margin:0;font-size:66px;font-weight:800;letter-spacing:2px}
  #title p{margin:8px 0 0;font-size:28px;font-weight:600}
  #lower{bottom:38px}
  #lower span{display:inline-block;background:rgba(20,20,20,.62);padding:12px 26px;border-radius:12px;font-size:26px;font-weight:700}
  #end{bottom:46px}
  #end span{display:inline-block;background:rgba(20,20,20,.62);padding:14px 30px;border-radius:12px;font-size:32px;font-weight:800}
</style></head>
<body>
<div id="title" class="ov"><h1>FEIRA DA PRAÇA SECA</h1><p>20 barracas · palco com show ao vivo</p></div>
<div id="lower" class="ov"><span>Acarajé · Artesanato · Churrasco · Caldos · Bebidas · Bolo de fatia · Feijoada</span></div>
<div id="end" class="ov"><span>Palco simples, sem telão · Show ao vivo</span></div>
<script src="node_modules/three/build/three.min.js"></script>
<script>
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc8ec);
scene.fog = new THREE.Fog(0xb9d6ee, 90, 260);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 600);

// ---------- deterministic random ----------
let seed = 7;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const pick = a => a[Math.floor(rnd() * a.length)];

// ---------- helpers ----------
const matCache = {};
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache[key]) matCache[key] = new THREE.MeshStandardMaterial(Object.assign({color, roughness: 0.8}, opts));
  return matCache[key];
}
function mesh(geo, material, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  return m;
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x8a7a66, 1.25));
const sun = new THREE.DirectionalLight(0xffe0b5, 2.6);
sun.position.set(-35, 45, 30);
sun.target.position.set(0, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = -50; sc.right = 50; sc.top = 40; sc.bottom = -40; sc.near = 1; sc.far = 160;
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

// ---------- ground (paving) ----------
const paveTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#b9b5ad'; g.fillRect(0, 0, w, h);
  const n = 8, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = 170 + Math.floor(rnd() * 30);
    g.fillStyle = `rgb(${v},${v - 3},${v - 9})`;
    g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
  }
}, [40, 40]);
const ground = mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshStandardMaterial({map: paveTex, roughness: 0.95}), 0, 0, 0, false);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
// darker street ring outside the square
const street = mesh(new THREE.RingGeometry(62, 120, 64), mat(0x5d5d60), 0, 0.01, 0, false);
street.rotation.x = -Math.PI / 2; scene.add(street);

// ---------- residential towers ----------
function towerTex(base, stripe, win) {
  return canvasTex(256, 512, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const cols = 8, rows = 24, cw = w / cols, rh = h / rows;
    for (let c = 0; c < cols; c++) {
      g.fillStyle = stripe; g.fillRect(c * cw, 0, cw * 0.18, h);
      for (let r = 0; r < rows; r++) {
        g.fillStyle = rnd() < 0.15 ? '#c9d7e3' : win;
        g.fillRect(c * cw + cw * 0.3, r * rh + rh * 0.22, cw * 0.55, rh * 0.55);
      }
    }
  });
}
const towerStyles = [
  ['#d9b38c', '#f2efe9', '#4a5560'], // beige with white stripes
  ['#9a9a98', '#b8b8b5', '#3d4650'], // grey
  ['#ece8e1', '#d7a77d', '#46505a'], // white with terracotta
];
function tower(x, z, w, d, h, style, rotY = 0) {
  const tex = towerTex(...towerStyles[style]);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(Math.max(1, Math.round(w / 12)), Math.max(1, h / 40));
  const side = new THREE.MeshStandardMaterial({map: tex, roughness: 0.9});
  const roof = mat(0x6e6a64);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, roof, roof, side, side]);
  m.position.set(x, h / 2, z); m.rotation.y = rotY;
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  // ground-floor shop band
  const band = mesh(new THREE.BoxGeometry(w + 0.4, 4, d + 0.4), mat(0x8c8678), x, 2, z, false);
  band.rotation.y = rotY; scene.add(band);
}
tower(-48, -46, 16, 14, 56, 0); tower(-22, -54, 24, 12, 44, 1); tower(8, -50, 18, 14, 62, 0);
tower(34, -48, 22, 12, 38, 2); tower(58, -30, 14, 14, 50, 1);
tower(66, 6, 16, 22, 30, 2); tower(58, 40, 18, 14, 46, 0);
tower(22, 56, 30, 12, 26, 2); tower(-14, 58, 20, 12, 52, 1); tower(-50, 50, 16, 16, 40, 0);
tower(-72, 12, 14, 26, 34, 2); tower(-70, -18, 14, 14, 58, 1);

// ---------- trees & planters ----------
function tree(x, z, s = 1) {
  scene.add(mesh(new THREE.CylinderGeometry(0.18 * s, 0.25 * s, 3.2 * s, 8), mat(0x5b4430), x, 1.6 * s, z));
  const c = mesh(new THREE.SphereGeometry(2.1 * s, 12, 10), mat(pick([0x4f8a3a, 0x5c9841, 0x467d34])), x, 4.3 * s, z);
  c.scale.y = 1.1; scene.add(c);
}
for (let x = -44; x <= 44; x += 11) { tree(x, -24, 0.9 + rnd() * 0.3); tree(x + 5, 24, 0.9 + rnd() * 0.3); }
for (let z = -16; z <= 16; z += 10) { tree(-50, z, 1); tree(42, z + 3, 1); }
function planter(x, z, w, d) {
  scene.add(mesh(new THREE.BoxGeometry(w, 0.6, d), mat(0xd6d0c4), x, 0.3, z));
  scene.add(mesh(new THREE.BoxGeometry(w - 0.4, 0.05, d - 0.4), mat(0x5aa33c), x, 0.62, z, false));
}
planter(-40, -18, 10, 4); planter(-40, 18, 10, 4); planter(32, -20, 8, 4); planter(32, 20, 8, 4);
// benches
for (const [x, z] of [[-30, 14], [-22, 15], [-30, -14], [0, 15], [8, -15]]) {
  scene.add(mesh(new THREE.BoxGeometry(2.4, 0.12, 0.6), mat(0x9a6a3c), x, 0.48, z));
  scene.add(mesh(new THREE.BoxGeometry(2.2, 0.42, 0.4), mat(0x555555), x, 0.21, z));
}

// ---------- people ----------
const shirts = [0xe63946, 0xf4a261, 0x2a9d8f, 0x264653, 0xffd166, 0x118ab2, 0xef476f, 0x06d6a0, 0xffffff, 0x8338ec, 0xfb5607, 0x3a86ff, 0x2b2b2b];
const pantsC = [0x1d3557, 0x2b2b2b, 0x4a4e69, 0x6d597a, 0x3c3c3c, 0xb5a48b];
const skins = [0x8d5524, 0xc68642, 0xe0ac69, 0xf1c27d, 0x5c3a21, 0xa86b3c];
function person(opts = {}) {
  const g = new THREE.Group();
  const s = opts.scale || (0.92 + rnd() * 0.16);
  const shirt = opts.shirt ?? pick(shirts), pants = opts.pants ?? pick(pantsC), skin = opts.skin ?? pick(skins);
  const legGeo = new THREE.CylinderGeometry(0.09, 0.08, 0.85, 6);
  const l1 = mesh(legGeo, mat(pants), -0.1, 0.425, 0); const l2 = mesh(legGeo, mat(pants), 0.1, 0.425, 0);
  const body = mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.65, 8), mat(shirt), 0, 1.17, 0);
  const head = mesh(new THREE.SphereGeometry(0.15, 10, 8), mat(skin), 0, 1.65, 0);
  const armGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.6, 6);
  const a1 = mesh(armGeo, mat(shirt), -0.28, 1.15, 0); const a2 = mesh(armGeo, mat(shirt), 0.28, 1.15, 0);
  g.add(l1, l2, body, head, a1, a2);
  if (opts.hat) g.add(mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.16, 10), mat(opts.hat), 0, 1.8, 0));
  g.userData = {l1, l2, a1, a2, body, head};
  g.scale.setScalar(s);
  scene.add(g);
  return g;
}

// ---------- signs & canopies ----------
function signTexture(text, bg) {
  return canvasTex(1024, 240, (g, w, h) => {
    g.fillStyle = '#5a3a1e'; g.fillRect(0, 0, w, h);
    g.fillStyle = bg; g.fillRect(14, 14, w - 28, h - 28);
    let size = 150;
    g.font = `900 ${size}px Inter, "DejaVu Sans", sans-serif`;
    while (g.measureText(text).width > w - 90) { size -= 6; g.font = `900 ${size}px Inter, "DejaVu Sans", sans-serif`; }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 14; g.strokeStyle = 'rgba(0,0,0,.55)'; g.strokeText(text, w / 2, h / 2 + 8);
    g.fillStyle = '#ffffff'; g.fillText(text, w / 2, h / 2 + 8);
  });
}
function stripeTexture(c1, c2) {
  return canvasTex(256, 64, (g, w, h) => {
    const n = 8;
    for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? c2 : c1; g.fillRect(i * w / n, 0, w / n, h); }
  });
}
function valanceTexture(c1, c2) {
  return canvasTex(512, 64, (g, w, h) => {
    const n = 8;
    for (let i = 0; i < n; i++) {
      g.fillStyle = i % 2 ? c2 : c1; g.fillRect(i * w / n, 0, w / n, h * 0.6);
      g.beginPath(); g.arc(i * w / n + w / n / 2, h * 0.6, w / n / 2, 0, Math.PI); g.fill();
    }
  });
}

// ---------- animated bits ----------
const smokeTex = canvasTex(64, 64, (g) => {
  const gr = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});
const puffs = [];
function smokeAt(worldPos, color, count, height) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.SpriteMaterial({map: smokeTex, color, transparent: true, depthWrite: false});
    const sp = new THREE.Sprite(m);
    scene.add(sp);
    puffs.push({sp, base: worldPos.clone(), off: rnd(), height, drift: (rnd() - 0.5) * 0.8});
  }
}

// ---------- stalls ----------
const palette = [
  ['#e63946', '#ffffff'], ['#ffbe0b', '#fb5607'], ['#2a9d8f', '#ffffff'], ['#3a86ff', '#ffffff'],
  ['#ff006e', '#ffd6e8'], ['#06d6a0', '#ffffff'], ['#8338ec', '#ffffff'], ['#f77f00', '#fcbf49'],
  ['#118ab2', '#ffd166'], ['#ef476f', '#ffffff'],
];
const signColors = {
  'ACARAJÉ': '#e07a00', 'ARTESANATO': '#7b2cbf', 'CHURRASCO': '#c1121f', 'CALDOS': '#2d6a4f',
  'BEBIDAS': '#0077b6', 'BOLO DE FATIA': '#d63384', 'FEIJOADA': '#3d2b1f',
};
const rowA = ['ACARAJÉ', 'ARTESANATO', 'CHURRASCO', 'CALDOS', 'BEBIDAS', 'BOLO DE FATIA', 'FEIJOADA', 'ACARAJÉ', 'BEBIDAS', 'ARTESANATO'];
const rowB = ['CHURRASCO', 'CALDOS', 'FEIJOADA', 'BOLO DE FATIA', 'BEBIDAS', 'ACARAJÉ', 'ARTESANATO', 'BEBIDAS', 'CHURRASCO', 'CALDOS'];
const vendors = [];

function products(g, kind) {
  const top = 0.97;
  if (kind === 'ACARAJÉ') {
    g.add(mesh(new THREE.CylinderGeometry(0.45, 0.35, 0.22, 16), mat(0x222222, {metalness: .6}), -0.7, top + 0.11, 0.85));
    for (let i = 0; i < 10; i++) g.add(mesh(new THREE.SphereGeometry(0.08, 8, 6), mat(0xd9822b), 0.2 + (i % 5) * 0.2, top + 0.08, 0.7 + Math.floor(i / 5) * 0.2));
  } else if (kind === 'ARTESANATO') {
    const cs = [0xe63946, 0xffbe0b, 0x2a9d8f, 0x8338ec, 0xfb5607, 0x3a86ff];
    for (let i = 0; i < 8; i++) g.add(mesh(new THREE.BoxGeometry(0.25, 0.2 + rnd() * 0.3, 0.25), mat(cs[i % 6]), -1.3 + i * 0.37, top + 0.2, 0.85));
    g.add(mesh(new THREE.BoxGeometry(3.2, 0.05, 0.05), mat(0x5a3a1e), 0, 2.2, -1.1));
    for (let i = 0; i < 7; i++) g.add(mesh(new THREE.BoxGeometry(0.3, 0.45, 0.04), mat(cs[(i + 2) % 6]), -1.35 + i * 0.45, 1.9, -1.1));
  } else if (kind === 'CHURRASCO') {
    g.add(mesh(new THREE.BoxGeometry(1.6, 0.3, 0.5), mat(0x1a1a1a, {metalness: .5}), -0.6, top + 0.15, 0.85));
    g.add(mesh(new THREE.BoxGeometry(1.5, 0.03, 0.42), mat(0xff4400, {emissive: 0xff3300, emissiveIntensity: 1.2}), -0.6, top + 0.31, 0.85, false));
    for (let i = 0; i < 6; i++) g.add(mesh(new THREE.BoxGeometry(0.08, 0.08, 0.5), mat(0x7a3b1a), -1.2 + i * 0.24, top + 0.37, 0.85));
    const p = new THREE.Vector3(-0.6, top + 0.6, 0.85); g.updateMatrixWorld(); g.localToWorld(p);
    smokeAt(p, 0xdddddd, 9, 3.2);
  } else if (kind === 'CALDOS' || kind === 'FEIJOADA') {
    const potC = kind === 'CALDOS' ? 0xbfc3c7 : 0x6b3e26;
    for (let i = 0; i < 3; i++) {
      g.add(mesh(new THREE.CylinderGeometry(0.28, 0.25, 0.4, 16), mat(potC, {metalness: kind === 'CALDOS' ? .7 : 0, roughness: .4}), -1 + i * 0.75, top + 0.2, 0.85));
      g.add(mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.02, 16), mat(kind === 'CALDOS' ? 0xe0a030 : 0x1c0f08), -1 + i * 0.75, top + 0.39, 0.85, false));
    }
    const p = new THREE.Vector3(-0.25, top + 0.6, 0.85); g.updateMatrixWorld(); g.localToWorld(p);
    smokeAt(p, 0xffffff, 5, 1.6);
  } else if (kind === 'BEBIDAS') {
    g.add(mesh(new THREE.BoxGeometry(0.9, 0.5, 0.5), mat(0x1d70b8), -0.9, top + 0.25, 0.85));
    for (let i = 0; i < 9; i++) g.add(mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 8), mat(pick([0x2d6a4f, 0x9c6644, 0xe63946, 0xffd166])), 0 + (i % 5) * 0.16, top + 0.15, 0.75 + Math.floor(i / 5) * 0.18));
    for (let i = 0; i < 3; i++) g.add(mesh(new THREE.SphereGeometry(0.15, 10, 8), mat(0x6a994e), 1.0 + i * 0.05, top + 0.15 + i * 0.12, 0.9 - i * 0.1));
  } else if (kind === 'BOLO DE FATIA') {
    g.add(mesh(new THREE.BoxGeometry(2.4, 0.5, 0.55), new THREE.MeshStandardMaterial({color: 0xddeeff, transparent: true, opacity: 0.35, roughness: .1}), 0, top + 0.25, 0.85, false));
    const cakes = [0x7b3f00, 0xf5deb3, 0xffb6c1, 0x3b1f0f];
    for (let i = 0; i < 4; i++) {
      g.add(mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.18, 16, 1, false, 0, Math.PI * 1.6), mat(cakes[i]), -0.85 + i * 0.57, top + 0.1, 0.85));
      g.add(mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.03, 16, 1, false, 0, Math.PI * 1.6), mat(0xffffff), -0.85 + i * 0.57, top + 0.2, 0.85, false));
    }
  }
}

function stall(x, z, facing, kind, colors) {
  const g = new THREE.Group();
  g.position.set(x, 0, z); g.rotation.y = facing;
  scene.add(g);
  const [c1, c2] = colors;
  // counter with cloth
  g.add(mesh(new THREE.BoxGeometry(3.2, 0.95, 0.7), mat(0xe9e2d0), 0, 0.475, 0.85));
  g.add(mesh(new THREE.BoxGeometry(3.25, 0.5, 0.72), mat(new THREE.Color(c1).getHex()), 0, 0.7, 0.86));
  g.add(mesh(new THREE.BoxGeometry(3.2, 0.8, 0.6), mat(0xcdbfa3), 0, 0.4, -0.9));
  // posts
  const postGeo = new THREE.CylinderGeometry(0.045, 0.045, 2.7, 8);
  for (const px of [-1.75, 1.75]) for (const pz of [-1.25, 1.3]) g.add(mesh(postGeo, mat(0xdddddd, {metalness: .5}), px, 1.35, pz));
  // canopy
  const canTex = stripeTexture(c1, c2);
  const canopy = mesh(new THREE.BoxGeometry(3.9, 0.04, 3.0), new THREE.MeshStandardMaterial({map: canTex, roughness: .9}), 0, 2.72, 0.02);
  canopy.rotation.x = 0.08; g.add(canopy);
  const val = new THREE.Mesh(new THREE.PlaneGeometry(3.9, 0.4), new THREE.MeshStandardMaterial({map: valanceTexture(c1, c2), transparent: true, alphaTest: 0.5, side: THREE.DoubleSide}));
  val.position.set(0, 2.42, 1.52); g.add(val);
  // sign
  for (const sx of [-1.2, 1.2]) g.add(mesh(new THREE.BoxGeometry(0.06, 0.5, 0.06), mat(0x5a3a1e), sx, 2.85, 1.48));
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 0.75), new THREE.MeshStandardMaterial({map: signTexture(kind, signColors[kind]), roughness: .7, emissive: 0xffffff, emissiveIntensity: 0.12, emissiveMap: null}));
  sign.position.set(0, 3.32, 1.5); sign.castShadow = true; g.add(sign);
  // sign back
  const back = mesh(new THREE.BoxGeometry(3.2, 0.75, 0.04), mat(0x5a3a1e), 0, 3.32, 1.47); g.add(back);
  products(g, kind);
  // vendor
  const v = kind === 'ACARAJÉ'
    ? person({shirt: 0xffffff, pants: 0xffffff, hat: 0xffffff})
    : person({shirt: pick([0xffffff, 0xe63946, 0x264653, 0xffd166])});
  const vp = new THREE.Vector3(rnd() * 1.2 - 0.6, 0, 0.1); g.localToWorld(vp);
  v.position.copy(vp); v.rotation.y = facing;
  vendors.push({p: v, ph: rnd() * 6});
}

const xs = []; for (let i = 0; i < 10; i++) xs.push(-30 + i * 4.5);
xs.forEach((x, i) => stall(x, -5, 0, rowA[i], palette[i]));
xs.forEach((x, i) => stall(x, 5, Math.PI, rowB[i], palette[(i + 5) % 10]));

// ---------- bunting (bandeirinhas) ----------
{
  const flagGeo = new THREE.BufferGeometry();
  flagGeo.setAttribute('position', new THREE.Float32BufferAttribute([-0.16, 0, 0, 0.16, 0, 0, 0, -0.32, 0], 3));
  flagGeo.computeVertexNormals();
  const lines = [];
  for (let i = 0; i < xs.length - 1; i++) lines.push(xs[i] + 2.25);
  lines.unshift(xs[0] - 2.25); lines.push(xs[xs.length - 1] + 2.25);
  const per = 22;
  const inst = new THREE.InstancedMesh(flagGeo, new THREE.MeshStandardMaterial({side: THREE.DoubleSide, roughness: .8}), lines.length * per);
  const fc = [0xe63946, 0xffbe0b, 0x2a9d8f, 0x3a86ff, 0xff006e, 0x06d6a0, 0xf77f00];
  const m4 = new THREE.Matrix4(); let k = 0;
  for (const lx of lines) {
    for (let j = 0; j < per; j++) {
      const t = j / (per - 1), z = -3.6 + t * 7.2, y = 3.9 - Math.sin(t * Math.PI) * 0.55;
      m4.makeRotationY(Math.PI / 2); m4.setPosition(lx, y, z);
      inst.setMatrixAt(k, m4); inst.setColorAt(k, new THREE.Color(fc[(j + k) % fc.length])); k++;
    }
  }
  scene.add(inst);
}

// ---------- plastic tables ----------
function plasticTable(x, z, color) {
  scene.add(mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.05, 16), mat(color), x, 0.72, z));
  scene.add(mesh(new THREE.CylinderGeometry(0.05, 0.25, 0.7, 8), mat(color), x, 0.35, z));
  for (let a = 0; a < 4; a++) {
    const cx = x + Math.cos(a * Math.PI / 2) * 0.75, cz = z + Math.sin(a * Math.PI / 2) * 0.75;
    scene.add(mesh(new THREE.BoxGeometry(0.42, 0.06, 0.42), mat(color), cx, 0.45, cz));
    const back = mesh(new THREE.BoxGeometry(0.42, 0.45, 0.05), mat(color), cx + Math.cos(a * Math.PI / 2) * 0.2, 0.68, cz + Math.sin(a * Math.PI / 2) * 0.2);
    back.rotation.y = -a * Math.PI / 2 + Math.PI / 2; scene.add(back);
  }
}
const seated = [];
for (const [x, z] of [[-37, -2], [-37, 3], [-41, 0], [-34, 9], [-26, 10], [-17, 10], [-8, 10], [-26, -10], [-12, -10], [2, -10], [2, 10]]) {
  plasticTable(x, z, pick([0xd62828, 0xd62828, 0xffffff, 0xf4d35e]));
  if (rnd() < 0.8) { const p = person(); p.position.set(x + 0.75, -0.35, z); seated.push(p); }
  if (rnd() < 0.6) { const p = person(); p.position.set(x - 0.75, -0.35, z); seated.push(p); }
}

// ---------- stage (palanque simples, sem telão) ----------
const SX = 24;
const stage = new THREE.Group(); stage.position.set(SX, 0, 0); scene.add(stage);
const woodTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#8b5a2b'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? '#7a4e25' : '#946233'; g.fillRect(0, i * 16, w, 15); }
}, [2, 2]);
stage.add(mesh(new THREE.BoxGeometry(4.2, 1.0, 6.4), new THREE.MeshStandardMaterial({map: woodTex, roughness: .85}), 0, 0.5, 0));
// stairs
for (let i = 0; i < 3; i++) stage.add(mesh(new THREE.BoxGeometry(1.0, 0.33 * (i + 1), 0.35), mat(0x7a4e25), 1.2, 0.165 * (i + 1), 3.2 + 0.35 * (2 - i) + 0.175));
// roof posts + dark canvas roof
const pGeo = new THREE.CylinderGeometry(0.07, 0.07, 3.2, 8);
for (const px of [-1.95, 1.95]) for (const pz of [-3.05, 3.05]) stage.add(mesh(pGeo, mat(0x222222, {metalness: .4}), px, 2.6, pz));
const roofMat = mat(0x262a33, {side: THREE.DoubleSide});
for (const s of [-1, 1]) {
  const r = mesh(new THREE.BoxGeometry(2.4, 0.05, 6.8), roofMat, s * 1.05, 4.55, 0);
  r.rotation.z = -s * 0.42; stage.add(r);
}
// simple fabric banner on the front beam
const banner = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 0.6), new THREE.MeshStandardMaterial({map: canvasTex(1024, 120, (g, w, h) => {
  g.fillStyle = '#f4d35e'; g.fillRect(0, 0, w, h);
  g.font = '900 70px Inter, "DejaVu Sans", sans-serif'; g.fillStyle = '#1d3557'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('FEIRA DA PRAÇA SECA', w / 2, h / 2 + 4);
}), side: THREE.DoubleSide}));
banner.position.set(-2.02, 3.72, 0); banner.rotation.y = -Math.PI / 2; stage.add(banner);
// small par lights
for (let i = 0; i < 4; i++) {
  const c = [0xff3366, 0xffcc00, 0x33ccff, 0xff3366][i];
  stage.add(mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.25, 10), mat(0x111111, {emissive: c, emissiveIntensity: 2}), -1.9, 4.05, -2.1 + i * 1.4, false));
}
const stageLight = new THREE.SpotLight(0xffd9a0, 30, 14, 0.7, 0.6, 1.2);
stageLight.position.set(SX - 4, 5, 0); stageLight.target.position.set(SX, 1.5, 0); scene.add(stageLight, stageLight.target);
// speakers on stands (sem telão)
for (const z of [-3.9, 3.9]) {
  scene.add(mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.6, 6), mat(0x222222), SX - 2.4, 0.8, z));
  scene.add(mesh(new THREE.BoxGeometry(0.55, 0.85, 0.55), mat(0x111111), SX - 2.4, 1.9, z));
  const cone = mesh(new THREE.CircleGeometry(0.18, 16), mat(0x333333), SX - 2.68, 1.85, z, false); cone.rotation.y = -Math.PI / 2; scene.add(cone);
}

// band (5 músicos)
const band = [];
function musician(z, x, shirt, inst) {
  const p = person({shirt});
  p.position.set(SX + x, 1.0, z); p.rotation.y = -Math.PI / 2;
  const g = p;
  if (inst === 'cavaco') { const c = mesh(new THREE.BoxGeometry(0.5, 0.18, 0.1), mat(0x8b4513), 0, 1.15, 0.24); c.rotation.z = 0.5; g.add(c); }
  if (inst === 'pandeiro') { const d = mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.05, 16), mat(0xf1e3c6), 0.35, 1.55, 0); d.rotation.z = Math.PI / 2; g.add(d); }
  if (inst === 'surdo') { scene.add(mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.6, 16), mat(0xc0c0c0, {metalness: .7, roughness: .3}), SX + x - 0.5, 1.3, z)); }
  if (inst === 'mic') {
    scene.add(mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.5, 6), mat(0x222222), SX + x - 0.45, 1.75, z));
    scene.add(mesh(new THREE.SphereGeometry(0.06, 8, 6), mat(0x333333), SX + x - 0.45, 2.52, z));
  }
  if (inst === 'tantan') { const t = mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.7, 12), mat(0xb22222), 0, 1.1, 0.25); t.rotation.z = Math.PI / 2.4; g.add(t); }
  band.push({p, ph: band.length * 0.7});
}
musician(0, -0.9, 0xffffff, 'mic');
musician(-1.9, -0.4, 0xe63946, 'cavaco');
musician(1.9, -0.4, 0xffd166, 'pandeiro');
musician(-1.0, 0.9, 0x2a9d8f, 'surdo');
musician(1.0, 0.9, 0x3a86ff, 'tantan');

// ---------- crowd ----------
const crowd = [];
for (let i = 0; i < 90; i++) {
  const x = 14 + rnd() * 7.2, z = -6.5 + rnd() * 13;
  const p = person(); p.position.set(x, 0, z);
  p.rotation.y = -Math.PI / 2 + (rnd() - 0.5) * 0.6;
  crowd.push({p, ph: rnd() * 6, amp: 0.05 + rnd() * 0.12, arms: rnd() < 0.25});
}
// customers at the stalls
const customers = [];
xs.forEach((x, i) => {
  if (i % 2 === 0) { const p = person(); p.position.set(x + (rnd() - 0.5) * 1.5, 0, -3.1); p.rotation.y = Math.PI; customers.push({p, ph: rnd() * 6}); }
  const q = person(); q.position.set(x + (rnd() - 0.5) * 1.5, 0, 3.1); q.rotation.y = 0; customers.push({p: q, ph: rnd() * 6});
});
// walkers along the aisle and around the square
const walkers = [];
for (let i = 0; i < 26; i++) {
  const p = person();
  const dir = rnd() < 0.5 ? 1 : -1;
  const lane = i < 16 ? (-2.4 + rnd() * 2.6) : (pick([-1, 1]) * (10 + rnd() * 8));
  walkers.push({p, dir, lane, x0: -40 + rnd() * 52, v: 0.8 + rnd() * 0.5, ph: rnd() * 6});
}
// a kid crossing the square
const bikeKid = person({scale: 0.62, shirt: 0xffffff});

// ---------- camera path ----------
const keys = [
  {t: 0,    p: [-46, 30, 32],  l: [-2, 0, 0]},
  {t: 4.5,  p: [-10, 27, 36],  l: [2, 0, 0]},
  {t: 7.5,  p: [-44, 9, 13],   l: [-24, 1.5, -2]},
  {t: 9.5,  p: [-35, 2.4, 1.9], l: [-31.5, 2.6, -4]},
  {t: 17.5, p: [-2, 2.4, 1.9],  l: [1.5, 2.6, -4]},
  {t: 20,   p: [7, 4.2, 1.5],   l: [SX, 2.4, 0]},
  {t: 24,   p: [11.5, 6.5, 9.5], l: [SX, 2.2, 0]},
];
function cr(p0, p1, p2, p3, u) {
  const u2 = u * u, u3 = u2 * u;
  return 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (-p0 + 3 * p1 - 3 * p2 + p3) * u3);
}
function ease(u) { return u * u * (3 - 2 * u); }
function camAt(t) {
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1].t) i++;
  const k0 = keys[Math.max(0, i - 1)], k1 = keys[i], k2 = keys[i + 1], k3 = keys[Math.min(keys.length - 1, i + 2)];
  let u = Math.min(1, Math.max(0, (t - k1.t) / (k2.t - k1.t)));
  // keep the stall pass linear (steady speed) and ease the rest
  if (i !== 3) u = ease(u);
  const P = [0, 1, 2].map(j => cr(k0.p[j], k1.p[j], k2.p[j], k3.p[j], u));
  const L = [0, 1, 2].map(j => cr(k0.l[j], k1.l[j], k2.l[j], k3.l[j], u));
  camera.position.set(...P); camera.lookAt(...L);
}

// ---------- overlays ----------
const ovs = {title: document.getElementById('title'), lower: document.getElementById('lower'), end: document.getElementById('end')};
function fade(t, a, b, d = 0.7) { return Math.max(0, Math.min(1, (t - a) / d, (b - t) / d)); }

// ---------- per-frame ----------
const BEAT = 0.6; // 100 bpm
window.renderAt = function (t) {
  const beat = t / BEAT;
  band.forEach(({p, ph}, i) => {
    p.position.y = 1.0 + Math.abs(Math.sin(Math.PI * beat + ph)) * 0.07;
    p.rotation.z = Math.sin(Math.PI * beat * 0.5 + ph) * 0.05;
    p.userData.a2.rotation.x = Math.sin(Math.PI * 2 * beat + ph) * 0.6;
  });
  crowd.forEach(({p, ph, amp, arms}) => {
    p.position.y = Math.abs(Math.sin(Math.PI * beat + ph)) * amp;
    if (arms) { p.userData.a1.rotation.z = -2.6 + Math.sin(Math.PI * beat + ph) * 0.3; p.userData.a2.rotation.z = 2.6 - Math.sin(Math.PI * beat + ph) * 0.3; p.userData.a1.position.y = 1.55; p.userData.a2.position.y = 1.55; }
  });
  customers.forEach(({p, ph}) => { p.rotation.z = Math.sin(t * 1.3 + ph) * 0.03; });
  vendors.forEach(({p, ph}) => { p.userData.a1.rotation.x = Math.sin(t * 2.2 + ph) * 0.5; });
  walkers.forEach(w => {
    let x = w.x0 + w.dir * w.v * t;
    x = ((x + 42) % 56 + 56) % 56 - 42;
    w.p.position.set(x, 0, w.lane);
    w.p.rotation.y = w.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    const s = Math.sin(t * 6 * w.v + w.ph) * 0.5;
    w.p.userData.l1.rotation.x = s; w.p.userData.l2.rotation.x = -s;
    w.p.userData.a1.rotation.x = -s * 0.8; w.p.userData.a2.rotation.x = s * 0.8;
  });
  bikeKid.position.set(-20 + t * 1.6, 0, -14); bikeKid.rotation.y = Math.PI / 2;
  puffs.forEach(pf => {
    const u = ((t * 0.35 + pf.off) % 1);
    pf.sp.position.set(pf.base.x + pf.drift * u, pf.base.y + u * pf.height, pf.base.z + u * 0.6);
    const s = 0.4 + u * 1.6; pf.sp.scale.set(s, s, s);
    pf.sp.material.opacity = 0.55 * Math.sin(Math.PI * u);
  });
  camAt(t);
  ovs.title.style.opacity = fade(t, 0.4, 6.8);
  ovs.lower.style.opacity = fade(t, 10.0, 17.0);
  ovs.end.style.opacity = fade(t, 20.8, 26);
  renderer.render(scene, camera);
  return true;
};
window.renderAt(0);
</script>

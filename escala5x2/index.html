<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala 5x2 Inteligente</title>
<meta name="description" content="Calcule o custo do fim da escala 6x1 na sua empresa, descubra quantas contratações ou horas extras fecham a conta e gere a escala 5x2 pronta.">
<meta name="theme-color" content="#0C6B6A">
<meta property="og:title" content="Escala 5x2 Inteligente">
<meta property="og:description" content="Quanto custa o fim da escala 6x1 na sua empresa? Calcule, compare caminhos e gere a escala 5x2.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C6B6A'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='14' text-anchor='middle' fill='white'%3E5x2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F0F3F1; --surface:#FFFFFF; --surface2:#F7F9F8; --ink:#13211B; --muted:#586861; --line:#D3DCD7;
  --accent:#0C6B6A; --accent-ink:#FFFFFF; --accent-soft:#D9EEEC;
  --work:#E6EBE8; --off:#0C6B6A; --off-ink:#FFFFFF;
  --good:#1D7A49; --good-soft:#DCF1E4; --warn:#9A5B00; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#F9DEDB;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1512; --surface:#141F1B; --surface2:#1A2722; --ink:#E5EEE9; --muted:#93A59B; --line:#27362F;
    --accent:#4CC2BC; --accent-ink:#06211F; --accent-soft:#143633;
    --work:#22302A; --off:#4CC2BC; --off-ink:#06211F;
    --good:#58C98A; --good-soft:#12301F; --warn:#E3A33B; --warn-soft:#36280D; --bad:#F2877F; --bad-soft:#3A1916;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#141F1B; --surface2:#1A2722; --ink:#E5EEE9; --muted:#93A59B; --line:#27362F;
  --accent:#4CC2BC; --accent-ink:#06211F; --accent-soft:#143633;
  --work:#22302A; --off:#4CC2BC; --off-ink:#06211F;
  --good:#58C98A; --good-soft:#12301F; --warn:#E3A33B; --warn-soft:#36280D; --bad:#F2877F; --bad-soft:#3A1916;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(1.6rem,4.2vw,2.2rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-direction:column;gap:6px}
.eyebrow{font:600 .72rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:10px 14px;font-size:.9rem}
.banner a{color:var(--accent)}
.example{display:inline-block;align-self:flex-start;font:600 .7rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:4px 8px;border-radius:4px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:10px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:500;color:var(--muted);min-width:0}
input,select,textarea{font:400 .95rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:90px;font-family:var(--f-mono);font-size:.85rem}
button.btn{appearance:none;font:600 .9rem var(--f-body);border-radius:6px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn.danger{color:var(--bad)}
button.btn:hover{filter:brightness(.97)}
details.prem>summary{cursor:pointer;font-weight:600;padding:2px 0}
.team{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface2);display:flex;flex-direction:column;gap:12px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days label.f{align-items:stretch;text-align:center}
.days input{text-align:center;padding-inline:4px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:center}
@media(max-width:720px){.hero{grid-template-columns:minmax(0,1fr)}}
.big{font:700 clamp(2.2rem,7vw,3.6rem)/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:.38em;font-weight:500;color:var(--muted);letter-spacing:0}
.kpis{display:flex;flex-direction:column;gap:8px}
.kpi{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.kpi b{font-variant-numeric:tabular-nums}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.phase{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.phase.cur{background:var(--surface2)}
.pill{display:inline-block;font:600 .72rem/1 var(--f-body);padding:4px 8px;border-radius:999px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:10px;align-items:center}
.bar .track{background:var(--work);border-radius:4px;height:22px;overflow:hidden}
.bar .fill{height:100%;background:var(--muted);border-radius:4px}
.bar.rec .fill{background:var(--accent)}
.bar.inv .fill{background:repeating-linear-gradient(135deg,var(--bad) 0 6px,transparent 6px 12px)}
@media(max-width:560px){.bar{grid-template-columns:minmax(0,1fr) 90px}.bar .track{grid-column:1/-1;order:3}}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.78rem}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
table.grid{font-family:var(--f-mono);font-size:.8rem}
table.grid th,table.grid td{text-align:center;padding:5px 7px}
table.grid td.name{text-align:left;font-family:var(--f-body);font-size:.85rem;position:sticky;left:0;background:var(--surface)}
.cell{display:inline-block;width:30px;border-radius:4px;padding:3px 0;font-weight:500}
.cell.t{background:var(--work);color:var(--ink)}
.cell.f{background:var(--off);color:var(--off-ink)}
th.dom,td.dom{border-left:2px solid var(--line)}
.cov-ok{color:var(--good);font-weight:600}
.cov-bad{color:var(--bad);font-weight:600}
.cov-up{color:var(--warn);font-weight:600}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{border-radius:6px;padding:9px 12px;font-size:.9rem}
.alert.bad{background:var(--bad-soft)}
.alert.warn{background:var(--warn-soft)}
.alert.good{background:var(--good-soft)}
pre.report{white-space:pre-wrap;word-break:break-word;font:400 .85rem/1.55 var(--f-mono);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0;max-height:520px;overflow:auto}
.cta{border:2px solid var(--accent);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:.9rem;z-index:20}
footer{font-size:.8rem;color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.fill{transition:width .3s ease}}
/* ===== Camada SaaS ===== */
[hidden]{display:none!important}
body{padding:0}
#view{max-width:1180px;margin-inline:auto;padding:20px 16px 56px;min-height:60vh}
a{color:var(--accent)}
.wrap{max-width:1080px}
.topbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin-inline:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:500 1rem var(--f-display)}
.brand b{font-weight:700}
.logo{display:inline-grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:700 .85rem var(--f-display);border-radius:6px;padding:5px 7px;letter-spacing:.02em}
.topnav{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.9rem}
.topnav a:not(.btn){color:var(--ink);text-decoration:none;font-weight:500}
.topnav a:not(.btn):hover{color:var(--accent)}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.btn{display:inline-block;appearance:none;font:600 .9rem var(--f-body);border-radius:6px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sm{padding:6px 10px;font-size:.82rem}
.btn.lg{padding:12px 20px;font-size:1rem}
nav.tabs a{color:var(--muted);font:600 .95rem var(--f-body);padding:10px 14px;border-bottom:3px solid transparent;text-decoration:none;white-space:nowrap}
nav.tabs a[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--muted)}
.chk input{width:auto;margin-top:3px}
.formmsg{margin:0}
.print-only{display:none}
.f.inline{min-width:150px}
.lead-in{max-width:68ch}
/* landing */
.land-hero{margin:-20px -16px 0;padding:44px 16px;background:linear-gradient(180deg,var(--accent-soft),var(--bg))}
.land-hero-in{max-width:1180px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:center}
@media(max-width:820px){.land-hero-in{grid-template-columns:minmax(0,1fr)}}
.land-hero h1{font-size:clamp(1.8rem,5vw,2.8rem)}
.lead{font-size:1.05rem;color:var(--muted)}
.sample .big{margin:6px 0 12px}
.land-sec{margin-inline:-16px;padding:44px 16px}
.land-sec.alt{background:var(--surface2);border-block:1px solid var(--line)}
.land-sec:last-child{margin-bottom:-56px}
.land-in{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.land-in.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:start}
@media(max-width:820px){.land-in.contact{grid-template-columns:minmax(0,1fr)}}
.steps h3{margin-top:8px}
.stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 .95rem var(--f-display)}
.pricing{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.plan{position:relative;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 18px}
.plan.hl{border:2px solid var(--accent)}
.plan.cur{background:var(--surface2)}
.plan .tag{position:absolute;top:-11px;left:16px;background:var(--accent);color:var(--accent-ink);font:600 .7rem var(--f-body);padding:4px 9px;border-radius:999px;letter-spacing:.04em}
.plan .price b{font:700 1.9rem var(--f-display)}
.plan .price small{color:var(--muted)}
.plan ul{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:4px;flex:1}
.plan-cta .btn{width:100%}
.faq{display:flex;flex-direction:column;gap:8px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.faq summary{cursor:pointer;font-weight:600}
.faq p{margin-top:8px;color:var(--muted)}
/* auth + legal */
.auth{max-width:440px;margin:24px auto}
.auth .card{padding:24px}
.h2{font-size:1.5rem}
.legal{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.legal h2{margin-top:10px}
.legal ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,16,.55);display:grid;place-items:center;padding:16px;z-index:30}
.modal-card{background:var(--surface);border-radius:10px;padding:22px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.toast{z-index:40}
.toast.bad{background:var(--bad);color:#fff}
/* painel */
.appbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.syncstat{font-size:.82rem;font-weight:600}
.syncstat.ok{color:var(--good)}.syncstat.wait{color:var(--warn)}.syncstat.bad{color:var(--bad)}
.banner.info{border-left-color:var(--accent);background:var(--accent-soft)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .track{background:var(--work);border-radius:4px;height:10px;overflow:hidden}
.meter .fill{height:100%;background:var(--accent);border-radius:4px}
.meter.warn .fill{background:var(--warn)}.meter.bad .fill{background:var(--bad)}
.kpicard{display:flex;flex-direction:column;gap:4px}
.big2{font:700 2rem var(--f-display);font-variant-numeric:tabular-nums}
.todo{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.card2{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.nowrap{white-space:nowrap}
footer{max-width:1180px;margin-inline:auto;padding:20px 16px 32px;border-top:1px solid var(--line)}
.foot-in{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.foot-in>div:first-child{max-width:60ch}
@media print{
  body{background:#fff;color:#000}
  .topbar,footer,.no-print,nav.tabs,.banner,.appbar,.toast,#trialbox{display:none!important}
  .print-only{display:block!important}
  #view{padding:0;max-width:none}
  .card{border:0;padding:0}
  .cell.t{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cell.f{background:#0C6B6A!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.grid td.name{position:static}
  .card{break-inside:avoid}
}
</style>
</head>
<body>
<header id="topbar" class="topbar"></header>
<main id="view"><p class="muted">Carregando...</p></main>
<footer id="foot"></footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">Este aplicativo precisa de JavaScript para funcionar.</p></noscript>

<script src="engine.js?v=1"></script>
<script src="core.js?v=1"></script>
<script src="calc.js?v=1"></script>
<script src="views.js?v=1"></script>
<script src="app.js?v=1"></script>
<script src="admin.js?v=1"></script>
<script src="boot.js?v=1"></script>
</body>
</html>

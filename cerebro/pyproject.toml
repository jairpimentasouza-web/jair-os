[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jos-cerebro"
version = "1.0.0"
description = "Cérebro do Jair OS: o Jarvis — comando de voz em português que entende, decide e executa."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietário — Jair Pimenta" }
dependencies = [
  "rapidfuzz>=3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
voz = [
  "faster-whisper>=1.0",
  "sounddevice>=0.4",
  "numpy>=1.22",
  "onnxruntime>=1.14",
]
oww = ["openwakeword>=0.6"]
windows = ["pycaw>=20230407; platform_system == 'Windows'", "comtypes>=1.2; platform_system == 'Windows'", "pillow>=10"]
piper = ["piper-tts>=1.2"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "httpx>=0.27", "numpy>=1.22", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
jarvis = "cerebro.__main__:main"

[tool.setuptools.packages.find]
include = ["cerebro*"]

[tool.setuptools.package-data]
cerebro = ["lexico/dados/*.yaml", "lexico/local.exemplo.yaml", "nlu/habilidades/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

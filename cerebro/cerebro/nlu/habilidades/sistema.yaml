- id: midia.pausar
  descricao: Pausar a música ou vídeo (YouTube no Chrome)
  risco: R0
  padroes:
    - "{v:pausar} [{art}] (musica|video|som|youtube|reproducao|isso|clipe|playlist)"
    - "(pausa|pause|da pause|da um pause|pausar)"
  exemplos: [pausa a musica, para o video, pausa, da um pause]
  slots: {}
  acao:
    executor: desktop
    passos:
      - {action: ui_focus, payload: {app: Google Chrome}}
      - {action: hotkey, payload: {keys: [k]}}
  respostas: ["Pausado.", "Pausando."]

- id: midia.continuar
